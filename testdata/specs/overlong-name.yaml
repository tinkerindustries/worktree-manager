# Invalid: the namespace template repeats {slug} until the worst-case
# resolution (a slug of spec.SlugMaxLen characters) exceeds the
# 63-character namespace cap.
# Rejected at validation, not at allocation (03-drivers §7).
version: 1
app: compose-app
slots:
  max: 4
resources:
  - type: namespace
    name: compose
    kind: compose
    template: "{app}-{slug}-{slug}-{slug}-{slug}-{slug}"
emit:
  descriptor:
    filename: wt-env.yaml
    format: yaml
