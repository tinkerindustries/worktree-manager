# vm-app's committed spec — the adoption signal. Shape per
# docs/design/03-drivers.md §3.1; hooks and emit are fixed in full by phase 0.
#
# slots.max is 100 even though the cidr pool only holds 64 blocks: the pool
# must be small enough to exhaust, which is what makes the capacity guard
# and the loud fallback real rather than theoretical (03-drivers §4.3).
version: 1
app: vm-app

slots:
  max: 100

resources:
  # One VM per worktree, capped at 4 concurrent instances (B4.2's guard).
  - type: machine
    name: vm
    driver: auto
    template: "{app}-{slug}-{slot}"
    max_concurrent: 4
    keep_flag: "--keep-vm"
  # A /22 per worktree out of 172.30.0.0/16 (B5.1): slot 1 takes
  # 172.30.0.0/22, slot 2 172.30.4.0/22, and so on; 64 blocks in all.
  - type: cidr
    name: egress
    pool: 172.30.0.0/16
    size: 22
    on_exhaustion: shared-pool

hooks:
  install:
    # The machine driver created the profile; this hook waits for its
    # dockerd (the warm-up is measured in minutes) and creates the
    # worktree's egress network on it with the worktree's /22 — the
    # network that makes the cidr allocation real.
    run: ./scripts/provision.sh --profile {vm} --subnet {egress}
  build:
    run: go build -o {worktree}/vm-app-check ./bin/server.go
    timeout: 5m
  health:
    # The VM is up and its egress network carries exactly this worktree's
    # /22 — a second worktree's network with a different subnet fails this
    # check, which is how a collision would surface.
    run: ./scripts/health.sh --profile {vm} --subnet {egress}

emit:
  descriptor:
    filename: wt-env.yaml
    format: yaml
