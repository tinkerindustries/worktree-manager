# The dev stack. No `name:` here on purpose: the project name comes from the
# worktree allocation (`-p {compose}`), and a pinned name would make the
# second worktree silently attach to the first one's containers (B2.1,
# D2). `verify` reports a pinned `name:` as the finding that catches that.
services:
  api:
    build: .
    environment:
      API_PORT: "${API_PORT}"
    ports:
      - "${API_PORT}:8080"
    volumes:
      - db:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]

volumes:
  db:
