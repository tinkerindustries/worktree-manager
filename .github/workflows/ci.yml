name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # The race detector gates: the coordinator is a resident daemon with a
      # goroutine per connection, background sweepers and shared handler
      # state, and it is race-clean today.
      - name: go test -race
        run: go test -race ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...

  api-drift:
    name: the described API is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Phase R2: api/openapi.yaml and internal/api/client/client.go are
      # generated from the route table and the api types, never
      # hand-maintained beside them. Regenerating on a clean tree must
      # produce no diff; a route, type or doc comment changed without
      # regenerating fails here (plan.md §5, phase R2 exit criteria).
      - name: regenerate the OpenAPI document and the client
        run: |
          go run ./cmd/wtgen
          if ! git diff --exit-code; then
            echo "the API artefacts are stale: run 'go run ./cmd/wtgen' and commit the result" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "the regeneration produced or removed files: $(git status --porcelain)" >&2
            exit 1
          fi

  sqlc-drift:
    name: the store queries are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # R0 deferred, due at R2: the sqlc output is committed and sqlc is
      # a build-time tool pinned by version at the point of invocation —
      # deliberately not a go.mod tool directive — so CI regenerates and
      # diffs it (PLAN-SCOPE.md, "In scope"; sqlc.yaml's header).
      - name: regenerate the store queries
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          if ! git diff --exit-code; then
            echo "the sqlc output is stale: run 'go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate' and commit the result" >&2
            exit 1
          fi

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          # The architecture a container built on an Apple Silicon machine
          # runs, so this cell is what puts the client into a local Docker
          # image (RELEASE.md, "Container clients").
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: cross-compile
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  windows:
    # Phase 8b: the parts a hosted windows-latest runner can actually
    # prove (plan.md §5, phase 8's exit criteria) — the build, the unit
    # and in-process layers, the store ACL set and its
    # refusal path (private_dir_windows_test.go), the task XML shape and
    # status parsing (task_windows_test.go), and long-path and
    # mapped-drive path realisation (realpath_windows_test.go). The
    # interactive-desktop surfaces — registering the logon task against a
    # real Task Scheduler, taskkill's escalation against a real desktop
    # process, Docker Desktop pipe and WSL2 reachability — are not
    # provable on a runner and are reported not_run.
    #
    # Advisory, not gating. Windows is supported with a weaker reaper and
    # permission model (and, since the move to HTTP on loopback, the same
    # transport as every other platform), and PLAN-SCOPE.md has it reported unmet rather than
    # simulated — no Windows machine has ever run this code. The job exists
    # so the failures are visible and countable; it does not fail the run,
    # because a permanently red required job would hide the Linux signal
    # that does gate.
    name: windows unit and in-process tests (advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  swift:
    name: swift build and test (macapp)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift build
        working-directory: macapp
        run: swift build
      - name: swift test
        working-directory: macapp
        run: swift test

  acceptance:
    name: acceptance gates (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # The two gates (plan.md §6) run against a coordinator in the
      # foreground — no supervisor — on a Linux runner with docker, the
      # only arrangement a hosted runner offers (phase 6). Gate 2 builds
      # the client binary and runs it inside a golang:1.26-alpine
      # container with --network host, reaching the coordinator's loopback
      # address over WT_ENDPOINT. Only the client binary needs sharing
      # into the container, so the runner's docker daemon must be able to
      # share the workspace path.
      - name: go test -tags acceptance
        run: go test -tags acceptance ./...
