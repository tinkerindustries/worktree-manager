name: release
# The release: pushing a v* tag assembles one archive per platform and
# publishes them against the tag.
#
# The assembly is split across two runners because the macOS menu bar app
# is a Swift build and cannot be cross-compiled. The linux and windows
# archives are assembled on Linux, the darwin archives on macOS with
# WorktreeMenu.app staged inside them, and the publish job joins the two
# halves into one release with one SHA256SUMS over every archive.
#
# The darwin job signs and notarizes the app when the six signing secrets
# are configured on this repository. With none of them set it says so and
# ad-hoc signs instead, which still ships an app: install.sh clears the
# quarantine attribute for an ad-hoc bundle, and a Developer ID bundle
# that has been notarized and stapled needs no such handling.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    name: check the tag
    # arc-linux, a self-hosted runner in the tinkerindustries fleet: an
    # ephemeral k3s pod on the Linux box, amd64 as ubuntu-latest was. The
    # account's Actions spending is blocked, so hosted runners refuse jobs
    # within a few seconds. FLEET.md in tinkerindustries/github-action-runner
    # describes the machines.
    runs-on: arc-linux
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # The tag is checked before anything is built, so a misnamed tag
      # costs nothing and produces no half-release. dist/build.sh applies
      # the same rule to the version it is handed; this step exists so the
      # failure names the tag rather than the version derived from it.
      - name: check the tag is a semantic version
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ "$GITHUB_REF_NAME" = "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not begin with v; a release tag is v<semver>, e.g. v0.2.0"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq "$semver"; then
            echo "::error::tag $GITHUB_REF_NAME is not v<semver> (MAJOR.MINOR.PATCH, optionally -prerelease and +build; see semver.org)"
            exit 1
          fi
          # A tag carrying a prerelease identifier (v1.0.0-rc.1) is
          # published as a prerelease, so it is not offered as the latest
          # release and an installer script following "latest" skips it.
          case "$version" in
          *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
          *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux-windows:
    name: assemble the linux and windows archives
    # arc-linux, a self-hosted runner in the tinkerindustries fleet: an
    # ephemeral k3s pod on the Linux box, amd64 as ubuntu-latest was. The
    # account's Actions spending is blocked, so hosted runners refuse jobs
    # within a few seconds. FLEET.md in tinkerindustries/github-action-runner
    # describes the machines.
    runs-on: arc-linux
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: assemble
        env:
          WT_CELLS: "linux/amd64 linux/arm64 windows/amd64"
        run: dist/build.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/out/
          retention-days: 1

  darwin:
    name: assemble the darwin archives with the menu bar app
    # macos-local, the Mac itself. The Swift menu bar app cannot be
    # cross-compiled, so this half of the release needs real macOS with
    # Xcode. Unlike macos-14 this machine is not a clean image: it carries
    # the login shell's pyenv, nvm, rustup and Homebrew, so a build here can
    # pick up a local toolchain version. The Swift build uses Xcode's
    # toolchain directly, which is why that does not bite this job.
    runs-on: macos-local
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # Signing needs all six: a Developer ID Application certificate (as
      # a base64 .p12) and its import password, the identity string
      # codesign signs with, and the three App Store Connect key values
      # notarytool needs to submit unattended. Absent any of them the app
      # is still built and still ships, ad-hoc signed.
      - name: check for signing credentials
        id: creds
        env:
          MACAPP_SIGNING_IDENTITY: ${{ secrets.MACAPP_SIGNING_IDENTITY }}
          MACAPP_CERTIFICATE_P12: ${{ secrets.MACAPP_CERTIFICATE_P12 }}
          MACAPP_CERTIFICATE_PASSWORD: ${{ secrets.MACAPP_CERTIFICATE_PASSWORD }}
          MACAPP_NOTARY_KEY_ID: ${{ secrets.MACAPP_NOTARY_KEY_ID }}
          MACAPP_NOTARY_KEY_ISSUER: ${{ secrets.MACAPP_NOTARY_KEY_ISSUER }}
          MACAPP_NOTARY_KEY_P8: ${{ secrets.MACAPP_NOTARY_KEY_P8 }}
        run: |
          if [ -n "$MACAPP_SIGNING_IDENTITY" ] && [ -n "$MACAPP_CERTIFICATE_P12" ] &&
            [ -n "$MACAPP_CERTIFICATE_PASSWORD" ] && [ -n "$MACAPP_NOTARY_KEY_ID" ] &&
            [ -n "$MACAPP_NOTARY_KEY_ISSUER" ] && [ -n "$MACAPP_NOTARY_KEY_P8" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::notice::macapp signing secrets are not fully configured (need MACAPP_SIGNING_IDENTITY, MACAPP_CERTIFICATE_P12, MACAPP_CERTIFICATE_PASSWORD, MACAPP_NOTARY_KEY_ID, MACAPP_NOTARY_KEY_ISSUER, MACAPP_NOTARY_KEY_P8); the menu bar app in this release is ad-hoc signed"
          fi
      - name: build WorktreeMenu.app
        run: macapp/Scripts/bundle.sh --configuration release
      # The standard shape for getting a Developer ID certificate onto a
      # hosted runner: decode the .p12 into a fresh, job-local keychain and
      # unlock it, so codesign can find the identity without a GUI prompt.
      # The runner is destroyed after the job either way; deleting the
      # keychain below is belt and braces.
      - name: import the signing certificate into a temporary keychain
        if: steps.creds.outputs.present == 'true'
        env:
          MACAPP_CERTIFICATE_P12: ${{ secrets.MACAPP_CERTIFICATE_P12 }}
          MACAPP_CERTIFICATE_PASSWORD: ${{ secrets.MACAPP_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macapp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/macapp-certificate.p12"
          echo "$MACAPP_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACAPP_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security default-keychain -d user | tr -d ' "')"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >>"$GITHUB_ENV"
      # sign.sh signs, notarizes and staples the bundle in place, so the
      # archives assembled below carry the stapled app. A stapled ticket is
      # what lets Gatekeeper approve it without asking Apple at launch.
      - name: sign, notarize and staple
        if: steps.creds.outputs.present == 'true'
        env:
          MACAPP_SIGNING_IDENTITY: ${{ secrets.MACAPP_SIGNING_IDENTITY }}
          MACAPP_NOTARY_KEY_ID: ${{ secrets.MACAPP_NOTARY_KEY_ID }}
          MACAPP_NOTARY_KEY_ISSUER: ${{ secrets.MACAPP_NOTARY_KEY_ISSUER }}
          MACAPP_NOTARY_KEY_P8: ${{ secrets.MACAPP_NOTARY_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/macapp-notary-key.p8"
          printf '%s' "$MACAPP_NOTARY_KEY_P8" >"$KEY_PATH"
          export MACAPP_NOTARY_KEY_PATH="$KEY_PATH"
          macapp/Scripts/sign.sh --version "${{ needs.version.outputs.version }}" --out "$RUNNER_TEMP/macapp-out"
          rm -f "$KEY_PATH"
      - name: remove the temporary keychain
        if: always() && steps.creds.outputs.present == 'true'
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
      # The two darwin binaries are signed with the same identity when one
      # is configured: wtd is a resident process that registers itself with
      # launchd, which is the shape Gatekeeper is most suspicious of.
      - name: assemble
        env:
          WT_CELLS: "darwin/arm64 darwin/amd64"
          WT_MACAPP_BUNDLE: macapp/.build/WorktreeMenu.app
          WT_DARWIN_SIGNING_IDENTITY: ${{ steps.creds.outputs.present == 'true' && secrets.MACAPP_SIGNING_IDENTITY || '' }}
        run: dist/build.sh "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/out/
          retention-days: 1

  publish:
    name: publish the release
    # arc-linux, a self-hosted runner in the tinkerindustries fleet: an
    # ephemeral k3s pod on the Linux box, amd64 as ubuntu-latest was. The
    # account's Actions spending is blocked, so hosted runners refuse jobs
    # within a few seconds. FLEET.md in tinkerindustries/github-action-runner
    # describes the machines.
    runs-on: arc-linux
    needs: [version, linux-windows, darwin]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: parts
      # Each half wrote a SHA256SUMS over the archives it produced. The
      # release carries one manifest covering every archive, so the two are
      # concatenated and sorted by filename. README.txt is generated from
      # the version alone and is identical in both halves, so either copy
      # will do.
      - name: join the two halves
        run: |
          mkdir -p out
          cp parts/*/wt-*.tar.gz parts/*/wt-*.zip out/
          cat parts/*/SHA256SUMS | sort -k2 >out/SHA256SUMS
          ls -1 out
      # GH_REPO names the repository outright. This job checks nothing out,
      # so gh has no git remote to infer it from and refuses with "not a
      # git repository" — which is what it did on the first release cut on
      # the self-hosted fleet.
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          notes=$(cat <<EOF
          The $GITHUB_REF_NAME distribution: one archive per platform containing \`wt\` and \`wtd\` plus the installer (\`install.sh\`, \`install.ps1\`). The macOS archives also carry \`WorktreeMenu.app\`, which the installer installs into \`/Applications\` and starts.

          Verify with the \`SHA256SUMS\` attached here, unpack, and run the installer:

          \`\`\`sh
          ./install.sh                 # host install: both binaries, coordinator registered and started, menu bar app on macOS
          ./install.sh --no-menubar    # the same without the menu bar app
          ./install.sh --client-only   # container install: the wt client alone
          \`\`\`

          See RELEASE.md for versioning, the compatibility policy, container clients and rollback.
          EOF
          )
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            out/wt-*.tar.gz out/wt-*.zip out/SHA256SUMS \
            --title "Worktree Manager $GITHUB_REF_NAME" \
            --notes "$notes" \
            $flags
