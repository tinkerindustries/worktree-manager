openapi: 3.1.0
info:
  title: worktree-manager
  version: 1..1
  description: "The worktree-manager coordinator API: per-worktree resource allocation served by wtd over loopback HTTP. Every RPC is POST /v1/<verb> with the verb's args object as the JSON body; the two exceptions are GET /version (the unversioned version-range report) and GET /v1/ping. These are RPCs, not REST resources — no resource semantics, no path parameters, no query strings (plan.md §5, phase R1). The route table in internal/api is the single source of this document and of the generated client, so the two cannot drift."
servers:
- url: http://127.0.0.1:7833
  description: the compiled-in default. A running coordinator writes its real address and the host token into endpoint.json under WT_HOME/$HOME/.wt; a host client reads it, and a container, which never mounts the store, is given WT_ENDPOINT and WT_CLIENT_TOKEN explicitly.
paths:
  /version:
    get:
      operationId: version
      summary: the coordinator's supported API version range
      description: "VersionInfo is the GET /version response: the coordinator's supported API version range. Unversioned on purpose — a client that cannot parse it is a client that needs the upgrade message, and the endpoint exists precisely so a mismatched pair learns about each other."
      security:
      - wtClient: []
      responses:
        "200":
          description: the version range, as one JSON object — the one response that is not the Response envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        "400":
          description: "code 2. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "403":
          description: "code 3 — refused: the Host check, or a request without X-Wt-Client: 1. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "424":
          description: "code 4. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "500":
          description: "code 1. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
  /v1/session:
    post:
      operationId: session
      summary: "SessionResult is the POST /v1/session response: the issued ephemeral session id."
      security:
      - bearerAuth: []
        wtClient: []
      requestBody:
        description: "the empty object: session carries no arguments"
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: the Response envelope carrying the SessionResult result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/SessionResult"
                  error:
                    $ref: "#/components/schemas/Error"
        "400":
          description: "code 2: the request body exceeds the 1 MiB cap, or is malformed. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "403":
          description: "code 3 — refused: the bearer, the Host check, X-Wt-Client, or a safety check. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Response"
        "404":
          description: "a path outside the route table: a plain 404, not a coordinator error — a route-table-derived client cannot produce it"
        "424":
          description: "code 4 — a capability the coordinator depends on is missing. The one error body shape: {\"error\":{\"code\":int,\"msg\":string,\"remedy\":string}} — the body is authoritative for the exit code; the HTTP status is advisory, for anything reading the API that is not wt"
          content:
